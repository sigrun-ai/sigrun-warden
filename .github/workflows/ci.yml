# CI: thin caller over the family's reusable workflow in sigrun-ai/sigrun
# (release workstream Task 2.2) — the jobs live there so they cannot
# drift across the repos. needs-core: true (file:../sigrun dev deps;
# core is checked out beside this repo first).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    uses: sigrun-ai/sigrun/.github/workflows/ext-ci.yml@main
    with:
      needs-core: true
